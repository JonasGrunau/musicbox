[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/probegen", "tools/rbdiff"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
publish = false

[workspace.dependencies]
mb-core = { path = "crates/mb-core" }
anyhow = "1"
thiserror = "2"
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"

# The analysis ports (FFT/CQT/filters) are far too slow unoptimised; keep debug builds and tests
# usable without changing their results (the ports reproduce rekordbox's float order explicitly).
[profile.dev.package.mb-analysis]
opt-level = 3
[profile.dev.package.mb-dsp]
opt-level = 3
[profile.dev.package.mb-audio]
opt-level = 3
