[package]
name = "musicbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies]
mb-core.workspace = true
mb-masterdb = { path = "../../crates/mb-masterdb" }
mb-library = { path = "../../crates/mb-library" }
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras = { workspace = true, features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mb-anlz = { path = "../../crates/mb-anlz" }
mb-devlib = { path = "../../crates/mb-devlib" }
mb-pdb = { path = "../../crates/mb-pdb" }
mb-usb = { path = "../../crates/mb-usb" }
mb-player = { path = "../../crates/mb-player" }
libc = "0.2"
