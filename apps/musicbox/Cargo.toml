[package]
name = "musicbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies]
mb-core.workspace = true
mb-masterdb = { path = "../../crates/mb-masterdb" }
mb-library = { path = "../../crates/mb-library" }
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras = { workspace = true, features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mb-analysis = { path = "../../crates/mb-analysis" }
mb-anlz = { path = "../../crates/mb-anlz" }
mb-devlib = { path = "../../crates/mb-devlib" }
mb-pdb = { path = "../../crates/mb-pdb" }
mb-usb = { path = "../../crates/mb-usb" }
mb-xml = { path = "../../crates/mb-xml" }
mb-player = { path = "../../crates/mb-player" }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The native menu bar (macOS); a generic crate, nothing rekordbox-specific.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
# The title bar's toolbar (window_chrome.rs); the same versions eframe already uses.
# The top bar's window drag (a local NSEvent monitor) needs NSEvent and blocks.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSToolbar", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSUserDefaults"] }
block2 = "0.6"
raw-window-handle = "0.6"
